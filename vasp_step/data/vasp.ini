# Configuration for how SEAMM runs VASP
#
# VASP is licensed software that you install yourself. This file tells SEAMM where it
# is and how to launch it. Edit the [local] section below to match your installation.
#
# SEAMM uses three VASP executables:
#   code               the standard build (vasp_std), used for most calculations
#   gamma_code         the Gamma-point-only build (vasp_gam), used when only the
#                      Gamma point is sampled
#   noncollinear_code  the non-collinear build (vasp_ncl), used for non-collinear spin
#
# In each command, {NTASKS} is replaced by the number of MPI tasks SEAMM chooses for
# the calculation. SEAMM adds the redirection of the output itself.
#
# If the commands are not given and vasp_std, vasp_gam and vasp_ncl are on your PATH,
# SEAMM fills them in here the first time it runs VASP.

[docker]
# Run VASP from a Docker container instead. You must build the container yourself,
# since VASP cannot be distributed. 'code' is the command inside the container, and
# {version} expands to the version of the plug-in.

code = vasp
# container = ghcr.io/molssi-seamm/seamm-vasp:{version}

# On Apple silicon you may need to force the platform for an amd64-only image:
# platform = linux/amd64

[local]
# How VASP is installed:
#     local: an executable you built or installed yourself
#   modules: loaded with environment modules ("module load ...")

installation = local

# For a local installation, give the full path to each executable, or just the name
# if it is on your PATH. For example:
#
# code = mpiexec -np {NTASKS} /path/to/vasp/bin/vasp_std
# gamma_code = mpiexec -np {NTASKS} /path/to/vasp/bin/vasp_gam
# noncollinear_code = mpiexec -np {NTASKS} /path/to/vasp/bin/vasp_ncl

# For environment modules, set installation = modules above, give the module(s) to
# load (see "module avail vasp"), and use the executable names without a path:
#
# modules = VASP/6.5.1-foss-2024a
# code = mpiexec -np {NTASKS} vasp_std
# gamma_code = mpiexec -np {NTASKS} vasp_gam
# noncollinear_code = mpiexec -np {NTASKS} vasp_ncl

# The -D4 functionals of the batch path (e.g. the MBE step's VASP:DFT@r2SCAN-D4)
# add the D4 dispersion with the dftd4 program (conda-forge dftd4, version 4,
# tested with 4.2.0 and 4.3.0), since VASP builds are often compiled without D4.
# Give its full path, or leave it unset to use dftd4 from the PATH. On
# TinkerCliffs:
#
# dftd4 = /projects/seamm/conda-envs/dftd4/bin/dftd4

# Notes
#  * If your MPI is started differently, e.g. with Slurm's srun, change
#    "mpiexec -np {NTASKS}" to match, e.g.
#        code = srun -n {NTASKS} vasp_std
#  * Without a Gamma-only build, SEAMM uses 'code' for Gamma-point calculations: the
#    results are the same, just slower. vasp_std cannot do non-collinear
#    calculations, so those need noncollinear_code.
#  * To check a command, run it by hand in an empty directory, e.g.
#        mpiexec -np 2 /path/to/vasp/bin/vasp_std
#    It should start, then stop complaining that there is no INCAR.
